<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta rel="stylesheet" href="style.css">
<title>Samaritan</title>
<link rel="icon" href="data:,">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
</head>
<body>
  <div id="main">
    <p id="text" class="hidden">&nbsp;</p>
    <hr id="bar">
  </div>
  <div id="marker">
    <span id="triangle">&#9650;</span>
  </div>
  <div id="settings" title="Réglages">&#9881;</div>
  <div id="panel">
    <h1>Samaritan // Réglages</h1>
    <p id="modelName"></p>
    <button id="logBtn">Afficher le journal</button>
    <div id="logView"></div>
    <button id="copyLogBtn" style="display:none">Copier le journal</button>
    <button id="replayLoaderBtn">Rejouer le chargement</button>
  </div>
  <div id="status"><div class="label"></div></div>

  <div id="loader">
    <div id="loader-center">
      <div id="boot-log"></div>
      <div id="loading-pane-container">
        <div><span class="invert">loading <span class="cursor-blink">_</span></span></div>
        <div id="loading-name">initialisation…</div>
        <div id="loading-bar-container"><div id="loading-bar"></div></div>
      </div>
      <div id="loading-connected"><span id="loading-connected-text" class="label">connection established</span></div>
    </div>
    <div id="loader-left" class="loader-pane"><i class="cnr t"></i><i class="cnr b"></i></div>
    <div id="loader-right" class="loader-pane"><i class="cnr t"></i><i class="cnr b"></i></div>
  </div>
<script src="index.js"></script>
</body>
</html>
